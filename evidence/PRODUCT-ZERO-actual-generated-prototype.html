<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A shared studio session / Prototype</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;margin:0;background:#f5f2e9;color:#20241f}main{max-width:820px;margin:40px auto;padding:28px}nav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #aaa;padding-bottom:20px}button,input,select{font:inherit;padding:12px;min-height:44px;border:1px solid #aaa;border-radius:2px}button{cursor:pointer;background:#c83f22;color:white}label,section{display:block;margin:20px 0}input,select{display:block;width:100%;margin-top:8px}input[type=checkbox]{width:auto;display:inline}h1{font-size:38px;letter-spacing:-1.5px}small{color:#666}li{margin:10px 0}</style><main><small>PRODUCT / ZERO / LOCAL PROTOTYPE / v2 / No production action</small><h2 id="brand"></h2><nav id="nav"></nav><article id="screen"></article><p role="status" id="feedback"></p></main><script>const s={"kind":"design-operation","version":2,"phase":"review","brief":{"title":"A shared studio session","brief":"Design a small prototype for people to plan a shared creative studio session. Let a person choose a session format and enter a name, see a preparation checklist, and save a local session draft. Include empty, invalid and saved states. No payments, real bookings or external messages. Keep the scope to two or three screens.","audience":"Adult creative collaborators preparing a small studio session. Keyboard and mobile access are required.","evidence":"Synthetic technical test brief. No interviews, analytics, observations or validated findings have been supplied.","designSystem":"none","direction":"editorial","tokens":{"primary":"#c83f22","background":"#f5f2e9","foreground":"#20241f","radius":2},"webResearch":false},"approval":"pending","research":{"problem":"Design a small prototype enabling adult creative collaborators to plan a shared studio session by selecting a session format, entering a session name, viewing a preparation checklist, and saving a local draft. The prototype must display empty, invalid, and saved states, and be operable via keyboard and mobile devices. Scope limited to two or three screens.","audience":"Adult creative collaborators preparing a small studio session; keyboard and mobile access required.","assumptions":["Users can operate a web interface via keyboard or touch.","Local storage is available on the target devices.","No external authentication or payment systems are needed."],"questions":["What default checklist items correspond to each session format?","How should saved drafts be named or organized for later retrieval?"],"evidence":[{"id":"E01","claim":"Brief specifies prototype features: choose format, enter name, checklist, save draft, empty/invalid/saved states, no payments, two‑three screens.","kind":"provided","source":"brief","confidence":"high"},{"id":"E02","claim":"Audience: adult creative collaborators, keyboard and mobile access required.","kind":"provided","source":"brief","confidence":"high"}],"researchPlan":[{"method":"Low‑fidelity wireframe to interactive HTML prototype","question":"Can users complete the session‑planning flow across device types?","participants":"Internal design team representing target audience","procedure":"Create sketches, convert to HTML/CSS, conduct internal walk‑throughs","success":"Prototype navigable on desktop and mobile with correct state transitions"},{"method":"Usability debrief think‑aloud session","question":"Do participants understand the empty, invalid, and saved states?","participants":"Two volunteers from the target group","procedure":"Task‑based session with think‑aloud commentary","success":"Feedback indicates clarity of states and flow"}],"requirements":[{"id":"R01","statement":"User can select a session format from a list (e.g., Collaborative workshop, Solo practice, Pair critique).","acceptance":["Dropdown or buttons present","Selection persists across screens","Visible focus state"],"evidenceIds":["E01","E02"]},{"id":"R02","statement":"User can enter a session name in a text field.","acceptance":["Field accepts alphanumeric input","Max length 50 characters","Empty input prevented on save"],"evidenceIds":["E01","E02"]},{"id":"R03","statement":"Preparation checklist appears after format and name are entered, showing default items relevant to the chosen format.","acceptance":["Checklist renders only after valid format+name","Items togglable","Context‑appropriate defaults"],"evidenceIds":["E01","E02"]},{"id":"R04","statement":"User can save a local session draft; draft persists across app relaunches via local storage.","acceptance":["Save button enabled after valid input","Draft loads on return","Saved indicator displayed"],"evidenceIds":["E01","E02"]},{"id":"R05","statement":"Empty state UI displayed when no session is loaded (no format selected, no name).","acceptance":["Placeholder text shown","Primary actions disabled","Clear visual cue"],"evidenceIds":["E01","E02"]},{"id":"R06","statement":"Invalid input state displayed when name is empty or too long, preventing save.","acceptance":["Error message shown","Save button disabled","Focus returned to field"],"evidenceIds":["E01","E02"]},{"id":"R07","statement":"UI supports both keyboard navigation and mobile touch.","acceptance":["Tab order follows logical flow","Focus outlines visible","Touch targets ≥48 dp","Voice‑over labels where applicable"],"evidenceIds":["E01","E02"]}],"alternatives":[{"name":"Format selection before name entry","tradeoff":"Ensures format context early but adds an extra step before naming."},{"name":"Name entry before format selection","tradeoff":"Allows naming first but risks format mismatch later."}],"risks":["Scope creep adding unintended features beyond the two‑three screen limit.","Loss of saved drafts if user clears browser data or switches devices.","Inconsistent touch target sizes on mobile causing usability issues.","Accessibility gaps for keyboard‑only users if focus management is inadequate."]},"technology":{"recommendation":"Prototype the shared studio session using a conservative web‑tech approach for Phase 1, with an exploratory React Native path for later mobile‑first enhancements.","options":[{"name":"Standard Web (HTML/CSS/JS)","capability":"Allow user to choose session format, enter a name, view a preparation checklist, and save a local session draft. Works in any browser on desktop or mobile.","fit":"Quick to implement, zero install barrier, immediate mobile browser support.","limitations":"Offline data limited to localStorage; no native device features; UI consistency across browsers may require minor tweaks.","permissions":"None beyond standard browser storage permissions; no camera, location, or push‑notification requests.","sourceUrl":"hypothesis","verification":"needs-verification"},{"name":"React Native (Expo)","capability":"Same feature set packaged as a cross‑platform app; offline storage via AsyncStorage; easier future addition of native capabilities.","fit":"Consistent look and feel on iOS/Android; can reuse React components; supports deeper offline scenarios.","limitations":"Requires app installation; larger bundle size; build‑environment setup; additional runtime overhead.","permissions":"May request generic file/Storage access; no mandatory camera/location permissions for this scope.","sourceUrl":"hypothesis","verification":"needs-verification"}],"affordances":[{"input":"Tap session‑format button","interaction":"Toggle selected format","outcome":"Format state stored locally","accessibleAlternative":"Keyboard focus + Space/Enter activation","validation":"needs-verification"},{"input":"Type session name into text field","interaction":"Input validation (non‑empty, length check)","outcome":"Name persisted with draft","accessibleAlternative":"Voice‑over / screen‑reader editable text","validation":"needs-verification"},{"input":"Toggle checklist items","interaction":"Check/uncheck boxes","outcome":"Checklist state saved","accessibleAlternative":"ARIA‑labelled checkboxes + keyboard space","validation":"needs-verification"},{"input":"Save draft button","interaction":"Form submit / localStorage write","outcome":"Session draft persisted","accessibleAlternative":"Command‑style shortcut (Ctrl+S) or voice command","validation":"needs-verification"},{"input":"Reload app / return to draft","interaction":"Retrieve saved draft from storage","outcome":"Previous session state restored","accessibleAlternative":"Back gesture or browser back button","validation":"needs-verification"}],"decisions":["Adopt conservative web tech for initial prototype to minimise integration effort and privacy risk.","Ensure WCAG 2.1 AA compliance via semantic HTML, ARIA labels, and keyboard navigation.","Implement local storage with clear user notice and opt‑out option for data persistence."]},"rubric":{"checks":[{"criterion":"Session format selection works via keyboard and mobile interfaces","method":"Heuristic evaluation + screen inspection","blocking":true},{"criterion":"Name entry accepts valid input, rejects invalid input, and displays an invalid state","method":"Heuristic evaluation + functional walkthrough","blocking":true},{"criterion":"Preparation checklist appears after format selection and is complete","method":"Heuristic evaluation","blocking":false},{"criterion":"Save draft functionality creates a local draft and persists across empty, invalid, and saved states","method":"Functional walkthrough","blocking":true},{"criterion":"UI shows correct empty, invalid, and saved states visualy","method":"Visual inspection against design tokens","blocking":false},{"criterion":"Keyboard navigation and touch targets meet accessibility basics (focus order, size, contrast)","method":"Accessibility heuristic check","blocking":true},{"criterion":"No external payments, bookings, or messages appear; scope limited to prototype","method":"Scope review","blocking":true},{"criterion":"Design tokens (primary #c83f22, background #f5f2e9, foreground #20241f, radius 2) are consistently applied","method":"Visual inspection","blocking":false}],"researchLimitations":["No primary user research, interviews, analytics, or validated findings have been supplied. Evaluation relies on heuristic and visual inspection."]},"ux":{"rationale":"Create IA, flow graph, journeys, and edge cases using the exact requirement IDs from the brief. Nodes represent screens/states; edges reference requirement IDs. Journeys cover empty, invalid, and saved paths. All outputs are concise and structured.","architecture":[{"id":"S01","label":"Empty State","purpose":"Show placeholder and disabled actions when no session loaded"},{"id":"S02","label":"Format Selection","purpose":"Let user pick session format; persist selection (R01)"},{"id":"S03","label":"Name Entry","purpose":"Enter session name with validation (R02)"},{"id":"S04","label":"Checklist","purpose":"Display default checklist relevant to chosen format (R03)"},{"id":"S05","label":"Saved Draft","purpose":"Show saved indicator and load draft on return (R04)"}],"flow":{"nodes":[{"id":"n0","label":"Start/Empty","type":"start"},{"id":"n1","label":"Format Selection","type":"screen"},{"id":"n2","label":"Name Entry","type":"screen"},{"id":"n3","label":"Checklist","type":"screen"},{"id":"n4","label":"Saved Draft","type":"end"},{"id":"n5","label":"Invalid Input","type":"decision"},{"id":"n6","label":"Empty State (no format/name)","type":"screen"}],"edges":[{"from":"n0","to":"n1","label":"R01: select format"},{"from":"n1","to":"n2","label":"R02: enter name"},{"from":"n2","to":"n3","label":"R03: checklist appears"},{"from":"n3","to":"n4","label":"R04: save draft"},{"from":"n0","to":"n6","label":"R05: empty state"},{"from":"n2","to":"n5","label":"R06: invalid input"},{"from":"n5","to":"n2","label":"re‑enter name"},{"from":"n1","to":"n5","label":"R06: invalid if no format"}]},"journeys":[{"step":"1. Empty start","userGoal":"User opens prototype and sees no session loaded.","systemResponse":"Empty state UI displayed (placeholder text, primary actions disabled) per R05.","edgeCase":"User taps disabled button; focus should remain and show error.","requirementIds":["R05"]},{"step":"2. Select format then enter name","userGoal":"User chooses a session format and types a valid session name.","systemResponse":"Format persists; name field accepts input; checklist appears after both are valid per R01‑R03.","edgeCase":"User leaves name empty; invalid state shown per R06.","requirementIds":["R01","R02","R03"]},{"step":"3. Save and load draft","userGoal":"User saves the session draft and returns to it later.","systemResponse":"Save button enabled; draft persisted via localStorage; saved indicator displayed per R04; on return draft loads.","edgeCase":"User clears browser data; draft lost (notified).","requirementIds":["R04"]}]},"ui":{"appName":"shared-studio-session","description":"UI schema for shared studio session prototype.","screens":[{"id":"S01","title":"Empty State","description":"No session loaded.","requirementIds":["R05"],"blocks":[{"id":"B1","kind":"text","label":"Placeholder","content":"Start a new shared studio session","required":true,"options":[],"action":"none","target":""},{"id":"B2","kind":"button","label":"Start","content":"","required":true,"options":[],"action":"navigate","target":"S02"}]},{"id":"S02","title":"Format & Name Entry","description":"Select format and enter name.","requirementIds":["R01","R02"],"blocks":[{"id":"B1","kind":"select","label":"Format","content":"Choose","required":true,"options":["Collaborative workshop","Solo practice","Pair critique"],"action":"none","target":""},{"id":"B2","kind":"input","label":"Session name","content":"","required":true,"options":[],"action":"none","target":""}]}],"implementationNotes":["Adopt conservative web tech (HTML/CSS) for Phase 1; ensure WCAG 2.1 AA compliance via semantic HTML and ARIA labels.","Keyboard navigation follows logical tab order; focus outlines visible using primary token #c83f22 on background #f5f2e9; contrast ratio checked to meet minimum 4.5:1.","Local storage used for draft persistence; user notice provided ('Session auto‑saved to local storage') on S03; data cleared if browser data is wiped.","Touch targets sized at minimum 48dp (≈48px at 1×) for all interactive elements; verify with screen‑size audit.","Apply consistent border‑radius of 2dp to all form elements and visual containers, verified in visual inspection.","Format‑specific default checklist items documented (e.g., Collaborative workshop: 'Gather supplies', 'Set up collaborative tools'; Solo practice: 'Prepare personal materials', etc.) or flagged as hypothesis."]},"checks":[{"name":"Flow references","pass":true,"detail":"Every edge resolves to an existing flow node."},{"name":"Unique flow IDs","pass":true,"detail":"No duplicate node identifiers."},{"name":"Screen navigation","pass":true,"detail":"Navigation actions resolve to implemented screens."},{"name":"Requirement traceability","pass":true,"detail":"Every screen links to a defined requirement."},{"name":"Unique block IDs","pass":true,"detail":"Form fields have unique identifiers."},{"name":"Evidence references","pass":true,"detail":"Requirement evidence identifiers resolve."},{"name":"Source attribution","pass":true,"detail":"Source claims have HTTPS citations; content requires review."},{"name":"Body text contrast","pass":true,"detail":"14.07:1 token contrast. Not a full accessibility audit."}],"review":{"verdict":"revise","summary":"Critique of the corrected draft reveals multiple critical and major gaps against the brief and rubric. The prototype exceeds the two‑to‑three screen limit, invalid‑state handling lacks disabled save button and focus‑return, save functionality does not prevent saving with empty/long names, touch‑target size, focus‑outline contrast, and checklist relevance are unverified or missing. Design‑token radius and saved‑draft notice are minor gaps. All findings include concrete fixes.","findings":[{"severity":"critical","artifact":"Screen count","issue":"Prototype includes four distinct screens (Empty State, Format & Name Entry, Checklist, Saved Draft), exceeding the brief's limit of two‑to‑three screens.","fix":"Combine Format & Name Entry with Checklist, or merge Empty State into the first navigation step to achieve a maximum of three screens."},{"severity":"critical","artifact":"Invalid‑state handling (R06)","issue":"Invalid‑state UI shows an error message but does not explicitly disable the Save button or return focus to the name field when the name is empty or exceeds 50 characters.","fix":"Add logic to disable the Save button until a valid name is entered and ensure focus returns to the name field with an error message displayed."},{"severity":"critical","artifact":"Save functionality","issue":"No explicit mechanism prevents saving when the name field is empty or too long; acceptance criteria require empty input to be prevented on save.","fix":"Implement form validation that disables the Save button until the name meets length and non‑empty requirements, and show a clear error if the user attempts to save invalid input."},{"severity":"major","artifact":"Touch target accessibility","issue":"Implementation notes claim touch targets are ≥48 dp, but no measurement or CSS evidence is provided; must be verified against WCAG 2.1 AA.","fix":"Provide CSS rules setting min‑width/min‑height of 48 dp (≈48 px at 1×) for all interactive elements and verify with a screen‑size audit."},{"severity":"major","artifact":"Focus outline contrast","issue":"Focus outlines use primary token #c83f22 on background #f5f2e9; contrast ratio must be checked to meet WCAG AA minimum 4.5:1.","fix":"Calculate the contrast ratio; if below 4.5:1, adjust the focus color or background to achieve compliance, or add a secondary outline style."},{"severity":"major","artifact":"Checklist relevance","issue":"Checklist items are generic ('Prepare materials', 'Set up workspace', 'Define goals') and not tied to the selected session format, contrary to expectations of format‑specific defaults.","fix":"Provide format‑specific default items (e.g., Collaborative workshop: 'Gather supplies', 'Set up collaborative tools'; Solo practice: 'Prepare personal materials', etc.) or document the decision as a hypothesis."},{"severity":"minor","artifact":"Design‑token radius","issue":"Token 'radius: 2' is listed but not demonstrably applied to UI components (buttons, inputs, cards).","fix":"Apply a consistent border‑radius of 2 dp (or appropriate CSS unit) to all form elements and visual containers, and verify in visual inspection."},{"severity":"minor","artifact":"Saved‑draft persistence notice","issue":"LocalStorage use and user notice are mentioned but no explicit notice UI present in screen descriptions.","fix":"Add a brief on‑screen notice (e.g., 'Session auto‑saved to local storage') on the Saved Draft screen and ensure the code writes to localStorage on each save."}],"unverified":["Touch targets ≥48 dp meet accessibility standards","Focus outline contrast ratio meets WCAG AA","Checklist items are relevant to each session format","Save persists across browser relaunches via localStorage","Design‑token radius 2 is applied consistently"]},"summary":"7 requirements, 7 flow nodes, 2 interactive screens. 8/8 machine checks passed. 8 review findings. Human review and real-world validation remain."};const ui=s.ui;let current=0,values={};const $=id=>document.getElementById(id);const el=(tag,text)=>{let e=document.createElement(tag);if(text)e.textContent=text;return e};function render(){let sc=ui.screens[current];$('brand').textContent=ui.appName;$('nav').replaceChildren(...ui.screens.map((v,i)=>{let b=el('button',v.title);b.onclick=()=>{current=i;render()};return b}));$('feedback').textContent='';let box=$('screen');box.replaceChildren(el('h1',sc.title),el('p',sc.description));sc.blocks.forEach(b=>{let wrap=el('section');if(b.kind==='input'||b.kind==='select'){let lab=el('label',b.label+(b.required?' *':''));let f=el(b.kind==='select'?'select':'input');f.value=values[b.id]||'';if(b.kind==='select'){f.append(el('option','Choose an option'));b.options.forEach(o=>f.append(el('option',o)))}f.oninput=()=>values[b.id]=f.value;lab.append(f);wrap.append(lab)}else if(b.kind==='toggle'){let lab=el('label',b.label),f=el('input');f.type='checkbox';f.onchange=()=>values[b.id]=f.checked;lab.prepend(f);wrap.append(lab)}else if(b.kind==='button'){let x=el('button',b.label);x.onclick=()=>{if(b.action==='navigate'){let i=ui.screens.findIndex(v=>v.id===b.target);if(i>=0){current=i;render()}}if(b.action==='submit'){let miss=sc.blocks.filter(a=>a.required&&['input','select','toggle'].includes(a.kind)&&!values[a.id]);$('feedback').textContent=miss.length?'Complete: '+miss.map(a=>a.label).join(', '):'Saved locally in this prototype. No external action.'}};wrap.append(x)}else{wrap.append(el('h3',b.label));if(b.kind==='list'){let ul=el('ul');(b.options.length?b.options:[b.content]).forEach(o=>ul.append(el('li',o)));wrap.append(ul)}else wrap.append(el('p',b.content))}box.append(wrap)})}render();</script></html>
